[project]
name = "toolkit"
version = "0.1.0"
description = "Portable AI agent for tabular data"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-httpx>=0.32",
  "ruff>=0.7",
  "mypy>=1.12",
  "types-python-dateutil>=2.9",
]

[project.scripts]
toolkit = "toolkit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkit"]
