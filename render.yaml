services:
  - type: web
    name: toolkit-api-staging
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TOOLKIT_FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: TOOLKIT_AI_PROVIDER
        sync: false
      - key: TOOLKIT_AI_API_KEY
        sync: false
